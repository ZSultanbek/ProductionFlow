server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Flutter web ships large .js and .json files; they compress very well.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml;

    # ^~ so this prefix beats the regex location below: without it a request for
    # /api/something.json would be matched by the asset rule and 404 as a
    # missing file instead of reaching the API.
    location ^~ /api/ {
        # Docker's embedded DNS. Going through a variable is deliberate: with a
        # literal `proxy_pass http://api:8080`, nginx resolves the name while
        # loading its config and refuses to start at all if the api container is
        # not up yet — so a crashed backend would take the frontend down with it.
        # A variable defers resolution to request time, so this container starts
        # and serves the app regardless, and /api just 502s until the API is back.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set $api_upstream  api:8080;

        # No URI part after the variable, so the original request URI is passed
        # through unchanged: /api/health -> http://api:8080/api/health
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The impact preview is a couple of queries, not a long poll.
        proxy_read_timeout 30s;
    }

    # index.html and the service worker decide which build the browser loads, so
    # they must never be cached — otherwise a deploy is invisible until the tab
    # is hard-reloaded.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Everything else Flutter emits is content-hashed or versioned by the build,
    # so it is safe to cache hard.
    location ~* \.(?:js|css|wasm|json|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # go_router uses real paths (/app, not /#/app), so any unknown path has to
    # serve index.html and let the router decide — including on a page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
